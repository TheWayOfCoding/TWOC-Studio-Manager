<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Hub — Backdrop</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
  align-items: center; justify-content: center; background: #111; color: #eee; text-align: center; cursor: none; }
#text { font-size: 4vw; max-width: 80vw; }
#theme { position: fixed; top: 0.5em; right: 1em; font-size: 0.9em; opacity: 0.6; }
#audio { position: fixed; bottom: 0.5em; right: 1em; font-size: 0.9em; opacity: 0.6; }
#exit { position: fixed; bottom: 0.5em; left: 1em; font-size: 0.9em; opacity: 0.6; }
#wash { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s, background 1s; }
#anim { position: fixed; inset: 0; display: none; }
#wash.candle { animation: flicker 5s ease-in-out infinite; }
@keyframes flicker { 0%,100% { filter: brightness(1); } 30% { filter: brightness(1.06); } 55% { filter: brightness(0.97); } 75% { filter: brightness(1.04); } }
</style>
</head>
<body>
<canvas id="anim"></canvas>
<div id="wash"></div>
<div id="theme"></div>
<div id="text"></div>
<div id="audio"></div>
<div id="exit"></div>
<script>
const id = decodeURIComponent(location.pathname.split("/").pop());
// Audio bed: tiny WebAudio synth (no assets). The kiosk shell passes
// --autoplay-policy=no-user-gesture-required, so a play pushed from the
// bench/control pages can start sound on its own; ensureAudio() runs on
// every play tick and the first click anywhere stays as the fallback arm.
// Track names shift the base pitch deterministically.
// Volume is 0..100 from the hub state (default 10), uncapped.
let actx = null, bed = null, seenBoot = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { /* silent kiosk stays silent */ }
}
addEventListener("click", ensureAudio);
// Curated backdrop looks (bench/control offer these in a dropdown; any
// other theme string from modes/config falls back to the default).
// Looping vector scenes (own layer, independent of themes). The
// fireplace is a pure function of a 60s loop clock — every cycle count
// is an integer, so it repeats seamlessly forever. Fish instead
// wander: stateful steering from summed sines, so their paths never
// repeat and never jump.
const LOOP_S = 60;
const animCanvas = document.getElementById("anim");
const gtx = animCanvas.getContext("2d");
let animName = "", animRaf = null, animLast = 0;
function sizeAnim() { animCanvas.width = innerWidth; animCanvas.height = innerHeight; }
addEventListener("resize", sizeAnim); sizeAnim();
function cyc(t, cycles) { return 2 * Math.PI * cycles * t / LOOP_S; }
function frac(x) { return x - Math.floor(x); }
function flamePath(x, base, w, h, sway) {
  gtx.beginPath();
  gtx.moveTo(x - w / 2, base);
  gtx.quadraticCurveTo(x - w / 2, base - h * 0.55, x + sway, base - h);
  gtx.quadraticCurveTo(x + w / 2, base - h * 0.55, x + w / 2, base);
  gtx.closePath();
}
function drawFireplace(t) {
  const W = animCanvas.width, H = animCanvas.height;
  gtx.clearRect(0, 0, W, H);
  const base = H * 0.88, cx = W / 2;
  const glow = gtx.createRadialGradient(cx, base, 10, cx, base, W * 0.36);
  glow.addColorStop(0, "rgba(255,140,40,0.35)");
  glow.addColorStop(1, "rgba(255,140,40,0)");
  gtx.fillStyle = glow; gtx.fillRect(0, 0, W, H);
  const layers = [
    [W * 0.30, H * 0.52, "rgba(200,60,0,0.55)", 7, 0],
    [W * 0.22, H * 0.42, "rgba(255,120,10,0.65)", 11, 2.1],
    [W * 0.13, H * 0.30, "rgba(255,200,60,0.8)", 17, 4.2],
  ];
  layers.forEach(([w, h, color, cycles, phase]) => {
    const sway = Math.sin(cyc(t, cycles) + phase) * w * 0.10;
    const hh = h * (1 + 0.07 * Math.sin(cyc(t, cycles * 2) + phase));
    gtx.fillStyle = color;
    flamePath(cx, base, w, hh, sway); gtx.fill();
  });
  for (let i = 0; i < 16; i++) {
    const dur = [5, 6, 7.5, 10, 12][i % 5];
    const rise = frac(t / dur + i * 0.37);
    const x = cx + (frac(i * 0.618) - 0.5) * W * 0.22 + Math.sin(cyc(t, 9) + i) * 6;
    gtx.globalAlpha = (1 - rise) * 0.9;
    gtx.fillStyle = "#ffb450";
    gtx.fillRect(x, base - rise * H * 0.55, 3, 3);
  }
  gtx.globalAlpha = 1;
  gtx.fillStyle = "#4a2c14";
  gtx.save(); gtx.translate(cx, base); gtx.rotate(0.06); gtx.fillRect(-W * 0.14, -H * 0.02, W * 0.28, H * 0.035); gtx.restore();
  gtx.save(); gtx.translate(cx, base); gtx.rotate(-0.05); gtx.fillRect(-W * 0.12, -H * 0.045, W * 0.24, H * 0.035); gtx.restore();
  gtx.fillStyle = "#1c1c1e";
  gtx.fillRect(cx - W * 0.20, base + H * 0.015, W * 0.40, H * 0.03);
}
const FISH = [
  { x: 0.2, y: 0.35, dir: 1, speed: 26, len: 92, color: "#ff8c42", seed: 1.7, heading: 0, vy: 0 },
  { x: 0.7, y: 0.55, dir: -1, speed: 20, len: 72, color: "#4db8ff", seed: 4.2, heading: Math.PI, vy: 0 },
  { x: 0.45, y: 0.25, dir: 1, speed: 33, len: 56, color: "#ffd94d", seed: 8.9, heading: 0, vy: 0 },
];
function wander(fish, dt, t, W, H) {
  fish.heading += (Math.sin(t * 0.37 + fish.seed) * 0.7 + Math.sin(t * 1.13 + fish.seed * 3.1) * 0.3) * dt;
  let ax = Math.cos(fish.heading), ay = Math.sin(fish.heading) * 0.45;
  if (fish.x < 0.12) ax += (0.12 - fish.x) * 6;
  if (fish.x > 0.88) ax -= (fish.x - 0.88) * 6;
  if (fish.y < 0.15) ay += (0.15 - fish.y) * 6;
  if (fish.y > 0.78) ay -= (fish.y - 0.78) * 6;
  const mag = Math.hypot(ax, ay) || 1;
  fish.x += ax / mag * fish.speed * dt / W;
  fish.y += ay / mag * fish.speed * dt / H;
  fish.dir = ax >= 0 ? 1 : -1;
  fish.vy = ay / mag;
}
function drawFish(fish, t) {
  const W = animCanvas.width, H = animCanvas.height;
  const px = fish.x * W, py = fish.y * H + Math.sin(t * 1.7 + fish.seed) * 6, L = fish.len;
  gtx.save();
  gtx.translate(px, py);
  gtx.scale(fish.dir, 1);
  gtx.rotate(fish.vy * 0.35 * fish.dir);
  const wag = Math.sin(t * 9 + fish.seed * 7) * L * 0.10;
  gtx.fillStyle = fish.color;
  gtx.beginPath();
  gtx.moveTo(-L * 0.30, 0);
  gtx.lineTo(-L * 0.55, -L * 0.22 + wag);
  gtx.lineTo(-L * 0.55, L * 0.22 + wag);
  gtx.closePath(); gtx.fill();
  gtx.beginPath();
  gtx.ellipse(0, 0, L * 0.38, L * 0.16, 0, 0, 2 * Math.PI);
  gtx.fill();
  gtx.fillStyle = "#ffffff";
  gtx.beginPath(); gtx.arc(L * 0.20, -L * 0.04, L * 0.045, 0, 2 * Math.PI); gtx.fill();
  gtx.fillStyle = "#10222e";
  gtx.beginPath(); gtx.arc(L * 0.21, -L * 0.04, L * 0.022, 0, 2 * Math.PI); gtx.fill();
  gtx.restore();
}
function drawFishtank(t, dt) {
  const W = animCanvas.width, H = animCanvas.height;
  gtx.fillStyle = "#07293e";
  gtx.fillRect(0, 0, W, H);
  gtx.fillStyle = "rgba(180,225,255,0.05)";
  for (let i = 0; i < 3; i++) {
    const rx = W * (0.18 + i * 0.28) + Math.sin(cyc(t, 5) + i * 2) * 24;
    gtx.beginPath();
    gtx.moveTo(rx, 0); gtx.lineTo(rx + W * 0.07, 0);
    gtx.lineTo(rx + W * 0.16, H * 0.75); gtx.lineTo(rx + W * 0.03, H * 0.75);
    gtx.closePath(); gtx.fill();
  }
  gtx.fillStyle = "#7d6234";
  gtx.beginPath();
  gtx.moveTo(0, H * 0.92);
  gtx.quadraticCurveTo(W * 0.5, H * 0.88, W, H * 0.93);
  gtx.lineTo(W, H); gtx.lineTo(0, H);
  gtx.closePath(); gtx.fill();
  [0.08, 0.3, 0.55, 0.8, 0.93].forEach((fx, pi) => {
    const x = W * fx;
    gtx.strokeStyle = pi % 2 ? "#2e7d4f" : "#35985e";
    gtx.lineWidth = 6;
    for (let b = 0; b < 3; b++) {
      const sway = Math.sin(cyc(t, 10) + pi + b) * 18;
      gtx.beginPath();
      gtx.moveTo(x + b * 9 - 9, H * 0.93);
      gtx.quadraticCurveTo(x + sway * 0.4, H * 0.75, x + sway, H * (0.55 + b * 0.07));
      gtx.stroke();
    }
    for (let i = 0; i < 3; i++) {
      const dur = [10, 12, 15][(pi + i) % 3];
      const rise = frac(t / dur + (pi * 3 + i) * 0.29);
      gtx.globalAlpha = 0.45 * (1 - rise * 0.5);
      gtx.strokeStyle = "#cfeaff";
      gtx.lineWidth = 1.5;
      gtx.beginPath();
      gtx.arc(x + Math.sin(cyc(t, 12) + i * 2) * 5, H * 0.9 - rise * H * 0.72, 3 + (i % 3) * 1.6, 0, 2 * Math.PI);
      gtx.stroke();
    }
  });
  gtx.globalAlpha = 1;
  FISH.forEach((fish) => { wander(fish, dt, t, W, H); drawFish(fish, t); });
}
const REEF = [
  { x: 0.15, y: 0.30, dir: 1, speed: 30, len: 86, color: "#ff8c42", seed: 2.3, heading: 0, vy: 0, stripe: "#ffffff" },
  { x: 0.80, y: 0.42, dir: -1, speed: 24, len: 78, color: "#2b6cff", seed: 5.1, heading: Math.PI, vy: 0, stripe: "#ffd94d" },
  { x: 0.55, y: 0.22, dir: 1, speed: 36, len: 52, color: "#ffd94d", seed: 9.4, heading: 0, vy: 0 },
  { x: 0.35, y: 0.60, dir: 1, speed: 18, len: 110, color: "#c9d6df", seed: 13.7, heading: 0, vy: 0, stripe: "#31424f" },
  { x: 0.65, y: 0.68, dir: -1, speed: 28, len: 60, color: "#ff6b9d", seed: 17.2, heading: Math.PI, vy: 0 },
  { x: 0.25, y: 0.48, dir: 1, speed: 22, len: 66, color: "#43d17c", seed: 21.9, heading: 0, vy: 0, stripe: "#0d5c2e" },
];
const ANTHIAS = Array.from({ length: 9 }, (_, i) => ({
  x: 0.1 + i * 0.09, y: 0.52 + (i % 3) * 0.035, dir: 1, speed: 34, len: 26,
  color: "#ffab5e", seed: 30 + i * 1.31, heading: 0, vy: 0,
}));
function drawStripeFish(fish, t) {
  drawFish(fish, t);
  if (!fish.stripe) return;
  const W = animCanvas.width, H = animCanvas.height;
  const px = fish.x * W, py = fish.y * H + Math.sin(t * 1.7 + fish.seed) * 6, L = fish.len;
  gtx.save(); gtx.translate(px, py); gtx.scale(fish.dir, 1);
  gtx.fillStyle = fish.stripe; gtx.globalAlpha = 0.75;
  gtx.fillRect(-L * 0.05, -L * 0.16, L * 0.07, L * 0.32);
  gtx.fillRect(L * 0.12, -L * 0.15, L * 0.05, L * 0.30);
  gtx.restore(); gtx.globalAlpha = 1;
}
function drawJelly(t, cx, cy, s, phase) {
  const pulse = 1 + 0.12 * Math.sin(t * 1.8 + phase);
  gtx.save(); gtx.translate(cx, cy + Math.sin(t * 0.6 + phase) * 14); gtx.scale(s * pulse, s / pulse);
  gtx.fillStyle = "rgba(210,170,255,0.35)";
  gtx.beginPath(); gtx.arc(0, 0, 34, Math.PI, 0); gtx.quadraticCurveTo(34, 16, 0, 12); gtx.quadraticCurveTo(-34, 16, -34, 0); gtx.closePath(); gtx.fill();
  gtx.strokeStyle = "rgba(210,170,255,0.5)"; gtx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    gtx.beginPath(); gtx.moveTo(i * 11, 10);
    gtx.quadraticCurveTo(i * 11 + Math.sin(t * 2 + phase + i) * 8, 44, i * 13 + Math.sin(t * 1.4 + phase + i * 2) * 12, 78);
    gtx.stroke();
  }
  gtx.restore();
}
function drawUnderwater(t, dt) {
  const W = animCanvas.width, H = animCanvas.height;
  const bg = gtx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0a4a6e"); bg.addColorStop(0.6, "#06334f"); bg.addColorStop(1, "#041e33");
  gtx.fillStyle = bg; gtx.fillRect(0, 0, W, H);
  gtx.fillStyle = "rgba(190,230,255,0.06)";
  for (let i = 0; i < 4; i++) {
    const rx = W * (0.12 + i * 0.24) + Math.sin(cyc(t, 5) + i * 2) * 30;
    gtx.beginPath(); gtx.moveTo(rx, 0); gtx.lineTo(rx + W * 0.06, 0);
    gtx.lineTo(rx + W * 0.17, H * 0.85); gtx.lineTo(rx + W * 0.02, H * 0.85); gtx.closePath(); gtx.fill();
  }
  // reef silhouettes + coral fans
  gtx.fillStyle = "#0a2e35";
  gtx.beginPath(); gtx.moveTo(0, H); gtx.lineTo(0, H * 0.9);
  gtx.quadraticCurveTo(W * 0.3, H * 0.84, W * 0.55, H * 0.92);
  gtx.quadraticCurveTo(W * 0.8, H * 0.97, W, H * 0.9); gtx.lineTo(W, H); gtx.closePath(); gtx.fill();
  [["#e2607a", 0.12], ["#e8935a", 0.88], ["#9b6dd6", 0.45]].forEach(([color, fx], ci) => {
    const x = W * fx, y = H * 0.9;
    gtx.strokeStyle = color; gtx.globalAlpha = 0.8; gtx.lineWidth = 5;
    for (let b = 0; b < 5; b++) {
      gtx.beginPath(); gtx.moveTo(x, y);
      gtx.quadraticCurveTo(x + (b - 2) * 16, y - 34, x + (b - 2) * 26 + Math.sin(cyc(t, 8) + ci + b) * 6, y - 58 - (b % 2) * 14);
      gtx.stroke();
    }
  });
  gtx.globalAlpha = 1;
  drawJelly(t, W * 0.78, H * 0.24, 1.0, 1.3);
  drawJelly(t, W * 0.16, H * 0.16, 0.65, 4.1);
  ANTHIAS.forEach((f) => { f.x += 0.00045; if (f.x > 1.1) f.x = -0.1; drawFish(f, t); });
  REEF.forEach((f) => { wander(f, dt, t, W, H); drawStripeFish(f, t); });
  for (let i = 0; i < 22; i++) {
    const dur = [9, 12, 15, 18][i % 4], rise = frac(t / dur + i * 0.23);
    gtx.globalAlpha = 0.4 * (1 - rise * 0.4); gtx.strokeStyle = "#cfeaff"; gtx.lineWidth = 1.4;
    gtx.beginPath(); gtx.arc(W * frac(i * 0.37), H * 0.95 - rise * H * 0.8, 2 + (i % 3) * 1.7, 0, 2 * Math.PI); gtx.stroke();
  }
  gtx.globalAlpha = 1;
}
function starLayer(t, count, seedBase, maxR) {
  const W = animCanvas.width, H = animCanvas.height;
  for (let i = 0; i < count; i++) {
    const x = W * frac(i * 0.731 + seedBase), y = H * frac(i * 0.417 + seedBase * 2);
    const tw = 0.55 + 0.45 * Math.sin(t * (1 + (i % 5) * 0.4) + i * 1.7);
    gtx.globalAlpha = Math.max(0.12, tw);
    gtx.fillStyle = i % 7 === 0 ? "#ffe9b8" : i % 5 === 0 ? "#bcd8ff" : "#ffffff";
    gtx.beginPath(); gtx.arc(x, y, (i % 3 === 0 ? maxR : maxR * 0.55), 0, 2 * Math.PI); gtx.fill();
  }
  gtx.globalAlpha = 1;
}
function drawStarfield(t) {
  const W = animCanvas.width, H = animCanvas.height;
  gtx.fillStyle = "#030612"; gtx.fillRect(0, 0, W, H);
  const band = gtx.createLinearGradient(0, H * 0.15, W, H * 0.8);
  band.addColorStop(0, "rgba(120,150,255,0)"); band.addColorStop(0.5, "rgba(150,170,255,0.13)"); band.addColorStop(1, "rgba(120,150,255,0)");
  gtx.fillStyle = band; gtx.fillRect(0, 0, W, H);
  starLayer(t, 190, 0.13, 1.9);
  const shoot = frac(t / 11);
  if (shoot < 0.09) {
    const sx = W * (0.75 - shoot * 5), sy = H * (0.12 + shoot * 2.2);
    const grad = gtx.createLinearGradient(sx, sy, sx + 130, sy - 44);
    grad.addColorStop(0, "rgba(255,255,255,0.95)"); grad.addColorStop(1, "rgba(255,255,255,0)");
    gtx.strokeStyle = grad; gtx.lineWidth = 2.2;
    gtx.beginPath(); gtx.moveTo(sx, sy); gtx.lineTo(sx + 130, sy - 44); gtx.stroke();
  }
}
function spikeStar(x, y, r, color) {
  gtx.strokeStyle = color; gtx.lineWidth = 1.6; gtx.globalAlpha = 0.9;
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3 + 0.3;
    gtx.beginPath(); gtx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
    gtx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); gtx.stroke();
  }
  gtx.fillStyle = "#ffffff"; gtx.beginPath(); gtx.arc(x, y, r * 0.16, 0, 2 * Math.PI); gtx.fill();
  gtx.globalAlpha = 1;
}
function drawNebula(t) {
  const W = animCanvas.width, H = animCanvas.height;
  gtx.fillStyle = "#07030d"; gtx.fillRect(0, 0, W, H);
  const clouds = [
    [0.32, 0.42, 0.42, "rgba(255,140,60,0.20)", 0.21],   // Spitzer/JWST infrared amber
    [0.58, 0.55, 0.5, "rgba(200,50,70,0.16)", 0.53],     // crimson
    [0.72, 0.3, 0.36, "rgba(40,180,190,0.14)", 0.87],    // teal counterpoint
    [0.45, 0.62, 0.3, "rgba(140,90,220,0.13)", 1.31],
  ];
  clouds.forEach(([fx, fy, fr, color, ph]) => {
    const x = W * fx + Math.sin(t * 0.05 + ph * 7) * W * 0.02, y = H * fy + Math.cos(t * 0.04 + ph * 5) * H * 0.02;
    const g = gtx.createRadialGradient(x, y, 8, x, y, Math.max(W, H) * fr);
    g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
    gtx.fillStyle = g; gtx.fillRect(0, 0, W, H);
  });
  starLayer(t, 240, 0.41, 1.7);
  spikeStar(W * 0.36, H * 0.34, 52, "rgba(255,220,170,0.8)");
  spikeStar(W * 0.68, H * 0.58, 38, "rgba(190,220,255,0.8)");
  spikeStar(W * 0.55, H * 0.22, 26, "rgba(255,190,200,0.7)");
}
function drawGalaxy(t) {
  const W = animCanvas.width, H = animCanvas.height, cx = W * 0.5, cy = H * 0.48;
  gtx.fillStyle = "#04050e"; gtx.fillRect(0, 0, W, H);
  starLayer(t, 130, 0.77, 1.5);
  const core = gtx.createRadialGradient(cx, cy, 4, cx, cy, Math.min(W, H) * 0.16);
  core.addColorStop(0, "rgba(255,240,210,0.95)"); core.addColorStop(0.35, "rgba(255,190,110,0.5)"); core.addColorStop(1, "rgba(255,170,90,0)");
  gtx.fillStyle = core; gtx.fillRect(0, 0, W, H);
  const maxR = Math.min(W, H) * 0.42, rot = t * 0.03;
  for (let i = 0; i < 420; i++) {
    const arm = i % 2, rr = Math.pow(frac(i * 0.618), 0.7) * maxR;
    const ang = arm * Math.PI + rr / maxR * 3.4 + rot + Math.sin(i * 12.9) * 0.14;
    const x = cx + Math.cos(ang) * rr * 1.25, y = cy + Math.sin(ang) * rr * 0.52;
    gtx.globalAlpha = Math.max(0.1, 0.85 - rr / maxR * 0.7);
    gtx.fillStyle = frac(i * 0.37) > 0.82 ? "#ffb8c8" : frac(i * 0.37) > 0.6 ? "#bcd4ff" : "#ffeecf";
    gtx.beginPath(); gtx.arc(x, y, frac(i * 0.53) > 0.92 ? 2.2 : 1.25, 0, 2 * Math.PI); gtx.fill();
  }
  gtx.globalAlpha = 1;
}
const GLYPHS = "01<>{}#$%&*+=;:!?/\\|()[]";
const CODE_COLS = Array.from({ length: 42 }, (_, i) => ({ x: i / 42, off: (i * 0.37) % 1, speed: 0.014 + (i % 7) * 0.0035 }));
function drawCode(t, dt) {
  const W = animCanvas.width, H = animCanvas.height;
  gtx.fillStyle = "rgba(3,14,8,0.32)"; gtx.fillRect(0, 0, W, H);
  gtx.font = "600 19px ui-monospace, monospace"; gtx.textAlign = "center";
  CODE_COLS.forEach((col, ci) => {
    col.off = (col.off + col.speed * dt * 3.2) % 1.25;
    const headY = col.off * H, colX = (col.x + 0.012) * W;
    for (let k = 0; k < 13; k++) {
      const y = headY - k * 21; if (y < -20 || y > H + 20) continue;
      gtx.fillStyle = k === 0 ? "#c9ffd9" : "rgba(45,220,110," + Math.max(0, 0.75 - k * 0.06) + ")";
      gtx.fillText(GLYPHS[(ci * 7 + k * 3 + Math.floor(t * 2 + ci)) % GLYPHS.length], colX, y);
    }
  });
}
const ROCKS = Array.from({ length: 7 }, (_, i) => ({
  x: 0.55 + (i % 4) * 0.16, y: 0.16 + (i * 0.13) % 0.7, r: 16 + (i % 3) * 9, speed: 0.045 + (i % 4) * 0.014, rot: i * 1.3,
}));
function drawShip(x, y, s, t) {
  gtx.save(); gtx.translate(x, y);

  src.start(t); src.stop(t + decay + 0.02);
}
function kickHit(master, t, peak) {
  const o = actx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
  o.connect(stepGain(master, t, peak || 0.9, 0.24));
  o.start(t); o.stop(t + 0.26);
}
function startSteps(volume, scale, bpm, totalSteps, onStep) {
  const master = makeMaster(volume, scale);
  const seq = { gain: master, levelScale: scale, oscs: [], lfo: null, timers: [], pad: null, step: 0 };
  const stepDur = 60 / bpm / 4;
  const tickStep = () => { onStep(seq.step % totalSteps, actx.currentTime + 0.03, master); seq.step += 1; };
  tickStep();
  seq.timers.push(setInterval(tickStep, stepDur * 1000));
  bed = seq;
}
function pianoNote(master, t, midi, peak, decay) {
  // Piano-ish voice: fundamental + fading harmonics, exponential decay.
  const g = actx.createGain();
  g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  g.connect(master);
  [[1, 1], [2, 0.35], [3, 0.12]].forEach(([mult, amt]) => {
    const o = actx.createOscillator();
    o.type = "sine"; o.frequency.value = midiHz(midi) * mult;
    const og = actx.createGain();
    og.gain.value = amt;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + decay + 0.05);
  });
}
function startPiano(volume) {
  // "piano" (alias "music"): broken Am7-F-C-G chords with a sparse
  // pentatonic melody, every note a decaying piano-style voice.
  const master = makeMaster(volume, 1.8);
  const piano = { gain: master, levelScale: 1.8, oscs: [], lfo: null, timers: [], pad: null, step: 0, chord: 0 };
  const playBar = () => {
    const t = actx.currentTime + 0.05;
    const chord = MUSIC_CHORDS[piano.chord % MUSIC_CHORDS.length];
    piano.chord += 1;
    pianoNote(master, t, chord[0] - 12, 0.20, 3.2);
    chord.forEach((midi, i) => pianoNote(master, t + 0.15 * i, midi, 0.12, 2.4));
    pianoNote(master, t + 1.6, MUSIC_SCALE[(piano.chord * 2) % MUSIC_SCALE.length], 0.10, 1.8);
    pianoNote(master, t + 2.9, MUSIC_SCALE[(piano.chord * 2 + 3) % MUSIC_SCALE.length], 0.09, 1.8);
  };
  playBar();
  piano.timers.push(setInterval(playBar, 4800));
  bed = piano;
}
const DANCE_ROOTS = [45, 41, 48, 43]; // A F C G
const DANCE_CHORDS = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 65]];
function startDance(volume) {
  // "dance": 124 BPM house — four-floor kick, offbeat hats + bass, claps.
  startSteps(volume, 2.0, 124, 64, (step, t, master) => {
    const bar = Math.floor(step / 16), s = step % 16;
    if (s % 4 === 0) kickHit(master, t, 0.9);
    if (s % 4 === 2) noiseHit(master, t, 0.10, 0.08, 7000);
    if (s === 4 || s === 12) noiseHit(master, t, 0.14, 0.12, 1800, "bandpass");
    if (s % 4 === 2) blip(master, t, DANCE_ROOTS[bar], { type: "sawtooth", peak: 0.20, decay: 0.22, lp: 600 });
    if (s === 0 || s === 8) DANCE_CHORDS[bar].forEach((midi) => blip(master, t, midi, { type: "sawtooth", peak: 0.04, decay: 0.35, lp: 2400 }));
  });
}
function startSynthwave(volume) {
  // "synthwave": 102 BPM — driving eighth bass, snare, slow detuned pads.
  startSteps(volume, 1.8, 102, 64, (step, t, master) => {
    const bar = Math.floor(step / 16), s = step % 16;
    if (s % 4 === 0) kickHit(master, t, 0.75);
    if (s === 4 || s === 12) noiseHit(master, t, 0.16, 0.14, 1800, "bandpass");
    if (s % 2 === 0) blip(master, t, DANCE_ROOTS[bar], { type: "sawtooth", peak: 0.16, decay: 0.24, lp: 500 });
    if (s === 0) EURO_CHORDS[bar].forEach((midi) => blip(master, t, midi + 12, { type: "sawtooth", peak: 0.025, decay: 3.6, lp: 1100 }));
    blip(master, t, EURO_CHORDS[bar][[0, 1, 2, 1][s % 4]] + 12, { type: "square", peak: 0.035, decay: 0.14 });
  });
}
const EURO_ROOTS = [45, 41, 48, 43]; // A F C G (MIDI, bass register)
const EURO_CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const EURO_LEAD = [69, 72, 76, 79, 76, 72, 74, 76];
function startEurobeat(volume) {
  // "eurobeat": 150 BPM A-minor driver — four-on-the-floor kick, offbeat
  // hats, pulsing octave bass, chord stabs, and a cycling lead riff.
  const master = actx.createGain();
  master.gain.value = 0.0;
  const comp = actx.createDynamicsCompressor();
  master.connect(comp); comp.connect(actx.destination);
  master.gain.linearRampToValueAtTime(bedLevel(volume) * 2.0, actx.currentTime + 1);
  const beat = { gain: master, levelScale: 2.0, oscs: [], lfo: null, timers: [], pad: null, step: 0 };
  const noise = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const env = (t, peak, decay) => {
    const g = actx.createGain();
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    g.connect(master);
    return g;
  };
  const kick = (t) => {
    const o = actx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    o.connect(env(t, 0.9, 0.24)); o.start(t); o.stop(t + 0.26);
  };
  const hat = (t) => {
    const src = actx.createBufferSource();
    src.buffer = noise;
    const hp = actx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 7000;
    src.connect(hp); hp.connect(env(t, 0.12, 0.05)); src.start(t); src.stop(t + 0.06);
  };
  const bass = (t, midi) => {
    const o = actx.createOscillator();
    o.type = "sawtooth"; o.frequency.value = midiHz(midi);
    const lp = actx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 700;
    o.connect(lp); lp.connect(env(t, 0.22, 0.20)); o.start(t); o.stop(t + 0.22);
  };
  const stab = (t, chord) => {
    chord.forEach((midi) => {
      [-6, 6].forEach((cents) => {
        const o = actx.createOscillator();
        o.type = "sawtooth"; o.frequency.value = midiHz(midi); o.detune.value = cents;
        const lp = actx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = 2600;
        o.connect(lp); lp.connect(env(t, 0.05, 0.28)); o.start(t); o.stop(t + 0.3);
      });
    });
  };
  const lead = (t, midi) => {
    const o = actx.createOscillator();
    o.type = "square"; o.frequency.value = midiHz(midi);
    o.connect(env(t, 0.045, 0.16)); o.start(t); o.stop(t + 0.18);
  };
  const stepDur = 60 / 150 / 4; // 150 BPM, 16th notes
  const tickStep = () => {
    const t = actx.currentTime + 0.03;
    const step = beat.step % 64;
    const bar = Math.floor(step / 16);
    const s16 = step % 16;
    if (s16 % 4 === 0) kick(t);
    if (s16 % 4 === 2) hat(t);
    if (s16 % 2 === 0) bass(t, EURO_ROOTS[bar] + (s16 % 8 === 6 ? 12 : 0));
    if (s16 === 0 || s16 === 7 || s16 === 10) stab(t, EURO_CHORDS[bar]);
    lead(t, EURO_LEAD[step % EURO_LEAD.length] + (bar === 3 ? 0 : 0));
    beat.step += 1;
  };
  tickStep();
  beat.timers.push(setInterval(tickStep, stepDur * 1000));
  bed = beat;
}
function startOcean(volume) {
  // "ocean": slow add9 pads with soft plucks and filtered-noise swells.
  startSteps(volume, 1.5, 52, 32, (step, t, master) => {
    const bar = Math.floor(step / 8), s = step % 8;
    const chords = [[57, 61, 64, 71], [55, 59, 62, 69], [53, 57, 60, 67], [55, 59, 62, 66]];
    if (s === 0) chords[bar % 4].forEach((midi) => blip(master, t, midi - 12, { peak: 0.05, decay: 5.5, lp: 900 }));
    if (s === 0 || s === 4) pianoNote(master, t, chords[bar % 4][s / 4 + 1] + 12, 0.05, 2.6);
    if (s === 2 || s === 6) noiseHit(master, t, 0.025, 1.8, 480, "lowpass");
  });
}
function startSpace(volume) {
  // "space": very slow detuned pads, sparse high plinks (deep-field calm).
  const master = makeMaster(volume, 1.3);
  const seq = { gain: master, levelScale: 1.3, oscs: [], lfo: null, timers: [], pad: null, step: 0 };
  const chords = [[45, 52, 59, 64], [43, 50, 57, 62], [41, 48, 55, 60], [43, 50, 59, 62]];
  const playPad = () => {
    const t = actx.currentTime + 0.05;
    chords[seq.step % 4].forEach((midi) => {
      [-5, 5].forEach((det) => blip(master, t, midi, { peak: 0.028, decay: 9, lp: 750, detune: det }));
    });
    seq.step += 1;
    [76, 81, 83, 88][seq.step % 4] && blip(master, t + 2.2, [76, 81, 83, 88][seq.step % 4], { peak: 0.035, decay: 2.8 });
  };
  playPad();
  seq.timers.push(setInterval(playPad, 8500));
  bed = seq;
}
function startLofi(volume) {
  // "lofi": co-working — 72 BPM soft piano chords, offbeat plucks, ticks.
  startSteps(volume, 1.6, 72, 32, (step, t, master) => {
    const bar = Math.floor(step / 8), s = step % 8;
    if (s === 0) MUSIC_CHORDS[bar % 4].forEach((midi, i) => pianoNote(master, t + i * 0.07, midi, 0.055, 2.8));
    if (s === 3 || s === 6) pianoNote(master, t, MUSIC_SCALE[(step + bar) % MUSIC_SCALE.length] + 12, 0.04, 1.4);
    if (step % 2 === 1) noiseHit(master, t, 0.012, 0.03, 5000);
  });
}
function startChip(volume) {
  // "chiptune": gaming — 140 BPM square-wave lead over tri bass.
  startSteps(volume, 1.4, 140, 64, (step, t, master) => {
    const bar = Math.floor(step / 16), s = step % 16;
    const roots = [45, 41, 43, 48];
    if (s % 2 === 0) blip(master, t, roots[bar] + (s % 8 === 6 ? 12 : 0), { type: "triangle", peak: 0.14, decay: 0.18 });
    blip(master, t, EURO_LEAD[step % EURO_LEAD.length] + 12, { type: "square", peak: 0.035, decay: 0.15 });
    if (s === 0 || s === 8) noiseHit(master, t, 0.03, 0.05, 7000);
  });
}
function startBed(track, volume) {
  if (!actx || bedPlaying()) return;
  try {
    // No hum, no test tone: every track is a real song. Unknown or
    // legacy track names fall back to piano.
    if (track === "eurobeat") { startEurobeat(volume); return; }
    if (track === "dance") { startDance(volume); return; }
    if (track === "synthwave") { startSynthwave(volume); return; }
    if (track === "ocean") { startOcean(volume); return; }
    if (track === "space") { startSpace(volume); return; }
    if (track === "lofi") { startLofi(volume); return; }
    if (track === "chiptune") { startChip(volume); return; }
    startPiano(volume);
  } catch (e) { bed = null; }
}
// Audio FX: one-shot synth voices, independent of the bed. The hub
// stamps {name, seq, volume} into the state feed; a new seq plays once.
let fxSeen = 0;
function fxGain(volume) {
  const g = actx.createGain();
  g.gain.value = 0.16 * ((volume == null ? 30 : volume) / 30);
  g.connect(actx.destination);
  return g;
}
function fxTone(t, freqA, freqB, dur, type, peak, dest) {
  const o = actx.createOscillator();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freqA, t);
  if (freqB) o.frequency.exponentialRampToValueAtTime(freqB, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(peak || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + dur + 0.03);
}
function playFx(name, volume) {
  ensureAudio();
  if (!actx) return;
  try {
    const t = actx.currentTime + 0.02, out = fxGain(volume);
    const noise = (dur, freq, peak, type) => {
      if (!NOISE_BUF) {
        NOISE_BUF = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
        const d = NOISE_BUF.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = actx.createBufferSource(); src.buffer = NOISE_BUF;
      const f = actx.createBiquadFilter(); f.type = type || "bandpass"; f.frequency.value = freq;
      src.connect(f); f.connect(stepGain(out, t, peak, dur));
      src.start(t); src.stop(t + dur + 0.02);
    };
    if (name === "stinger") { [52, 59, 64].forEach((m, i) => fxTone(t + i * 0.02, midiHz(m), null, 0.7, "sawtooth", 0.16, out)); noise(0.4, 900, 0.1); }
    else if (name === "ding") fxTone(t, 1318, null, 0.7, "sine", 0.5, out);
    else if (name === "pop") fxTone(t, 480, 920, 0.09, "square", 0.32, out);
    else if (name === "blip") fxTone(t, 880, 660, 0.08, "square", 0.25, out);
    else if (name === "coin") { fxTone(t, 988, null, 0.09, "square", 0.3, out); fxTone(t + 0.09, 1319, null, 0.28, "square", 0.3, out); }
    else if (name === "levelup") [523, 659, 784, 1047].forEach((f, i) => fxTone(t + i * 0.09, f, null, 0.16, "square", 0.28, out));
    else if (name === "powerup") fxTone(t, 220, 1180, 0.32, "sawtooth", 0.22, out);
    else if (name === "whoosh") noise(0.42, 700, 0.32);
    else if (name === "error") { fxTone(t, 196, 185, 0.18, "square", 0.32, out); fxTone(t + 0.19, 185, 147, 0.3, "square", 0.32, out); }
    else if (name === "success") [659, 784, 988].forEach((f, i) => fxTone(t + i * 0.08, f, null, 0.22, "triangle", 0.4, out));
    else if (name === "applause") { for (let i = 0; i < 16; i++) setTimeout(() => noise(0.05, 1800 + Math.random() * 900, 0.24), i * 55 + Math.random() * 30); }
    else if (name === "laser") fxTone(t, 1450, 140, 0.22, "sawtooth", 0.26, out);
    else if (name === "unlock") { fxTone(t, 392, null, 0.1, "triangle", 0.4, out); fxTone(t + 0.11, 784, null, 0.24, "triangle", 0.4, out); }
    else if (name === "alert") { fxTone(t, 1047, null, 0.13, "square", 0.3, out); fxTone(t + 0.2, 1047, null, 0.13, "square", 0.3, out); }

}
function setBedLevel(volume) {
  if (!bedPlaying()) return;
  try { bed.gain.gain.linearRampToValueAtTime(bedLevel(volume) * (bed.levelScale || 1), actx.currentTime + 0.5); }
  catch (e) { /* already quiet */ }
}
function stopBed() {
  if (!bedPlaying()) return;
  const current = bed;
  bed = null;
  try {
    (current.timers || []).forEach((t) => clearInterval(t));
    current.gain.gain.linearRampToValueAtTime(0.0, actx.currentTime + 0.5);
    const oscs = [...(current.oscs || []), ...((current.pad && current.pad.oscs) || [])];
    setTimeout(() => {
      oscs.forEach((o) => { try { o.stop(); } catch (e) {} });
      if (current.lfo) { try { current.lfo.stop(); } catch (e) {} }
    }, 700);
  } catch (e) { /* already quiet */ }
}
async function tick() {
  try {
    const r = await fetch("/api/screens/" + encodeURIComponent(id) + "/state");
    const s = await r.json();
    if (seenBoot === null) seenBoot = s.hub;
    else if (s.hub && s.hub !== seenBoot) { location.reload(); return; }
    document.title = "Backdrop — " + id;
    document.getElementById("theme").textContent = s.theme ? "theme: " + s.theme : "";
    document.getElementById("text").textContent = s.text || "";
    const vol = s.volume == null ? 10 : s.volume;
    const armed = actx && actx.state === "running";
    document.getElementById("audio").textContent =
      s.audio === "play" ? "♪ " + (s.track || "piano") + " " + vol + "%" + (armed ? "" : " (click for sound)") : "";
    if (s.fx && s.fx.seq && s.fx.seq !== fxSeen) { fxSeen = s.fx.seq; playFx(s.fx.name, s.fx.volume); }
    document.body.style.background = THEME_BG[s.theme] || "#111";
    const wash = document.getElementById("wash");
    if (s.theme === "candle") {
      wash.style.background = "#3a2408";
      wash.style.opacity = 0.55;
      wash.className = "candle";
    } else if (s.wash && s.wash.color) {
      wash.style.background = s.wash.color;
      wash.style.opacity = s.wash.opacity == null ? 0.5 : s.wash.opacity;
      wash.className = "";
    } else {
      wash.style.opacity = 0;
      wash.className = "";
    }
    if (s.animation) startAnim(s.animation); else stopAnim();
    if (s.audio === "play") {
      ensureAudio();
      if (bedPlaying()) setBedLevel(vol); else startBed(s.track, vol);
    } else stopBed();
  } catch (e) { document.getElementById("text").textContent = "hub unreachable"; }
}
tick();
setInterval(tick, 500);
// Tauri shell escape: ESC twice within 2s closes the window. Plain browsers
// have no __TAURI_INTERNALS__, so they ignore this and keep native ESC.
let escAt = 0;
addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !window.__TAURI_INTERNALS__) return;
  const now = Date.now(), hint = document.getElementById("exit");
  if (now - escAt < 2000) {
    hint.textContent = "closing\u2026";
    try {
      const done = window.__TAURI_INTERNALS__.invoke("plugin:window|close", { label: "main" });
      if (done && done.catch) done.catch((e) => { hint.textContent = "close denied (" + e + ")"; });
    } catch (e) { hint.textContent = "close failed (" + e + ")"; }
  } else {
    escAt = now;
    hint.textContent = "ESC again to exit";
    setTimeout(() => { if (escAt === now) hint.textContent = ""; }, 2000);
  }
});
