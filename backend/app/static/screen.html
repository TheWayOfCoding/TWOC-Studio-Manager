<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Hub — Backdrop</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
  align-items: center; justify-content: center; background: #111; color: #eee; text-align: center; }
#text { font-size: 4vw; max-width: 80vw; }
#theme { position: fixed; top: 0.5em; right: 1em; font-size: 0.9em; opacity: 0.6; }
#audio { position: fixed; bottom: 0.5em; right: 1em; font-size: 0.9em; opacity: 0.6; }
</style>
</head>
<body>
<div id="theme"></div>
<div id="text">waiting for push…</div>
<div id="audio"></div>
<script>
const id = decodeURIComponent(location.pathname.split("/").pop());
async function tick() {
  try {
    const r = await fetch("/api/screens/" + encodeURIComponent(id) + "/state");
    const s = await r.json();
    document.title = "Backdrop — " + id;
    document.getElementById("theme").textContent = s.theme ? "theme: " + s.theme : "";
    document.getElementById("text").textContent = s.text || "(no text pushed)";
    document.getElementById("audio").textContent =
      s.audio === "play" ? "♪ " + (s.track || "bed") : "";
    document.body.style.background = s.theme === "work" ? "#1a2a1a" : s.theme === "live" ? "#2a1a1a" : "#111";
  } catch (e) { document.getElementById("text").textContent = "hub unreachable"; }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
