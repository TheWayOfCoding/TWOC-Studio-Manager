<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Hub — Control</title>
<link rel="stylesheet" href="/hub.css">
<script src="/nav.js" defer></script>
</head>
<body>
<header class="topbar">
<span class="brand">Studio Hub</span>
<button type="button" class="nav-toggle" aria-expanded="false" aria-controls="mainnav" aria-label="Menu">☰</button>
<nav id="mainnav" aria-label="Main"><a href="/">Dashboard</a><a href="/control" aria-current="page">Control</a><div class="navdrop"><button type="button" class="navdrop-toggle" aria-expanded="false" aria-controls="navadmin">Administration</button><div class="navdrop-menu" id="navadmin"><a href="/equipment">Equipment</a><a href="/modality">Modality Manager</a><a href="/ordering">Ordering</a><a href="/datamap">Data map</a><a href="/obs">OBS targets</a><a href="/bench">Test Bench</a><a href="/docs">API docs</a></div></div></nav>
</header>
<div class="wrap narrow">
<h1>Control</h1>
<p class="lede">Adjust one asset at a time. Pick it below — scenes and raw bring-up stay on the Test Bench.</p>
<div class="row"><label class="field" for="studio">Studio</label><select id="studio" onchange="loadDevices()"></select></div>
<div class="row"><label class="field" for="device">Asset (A–Z)</label><select id="device" onchange="renderCard()"></select></div>
<div class="row"><label><input type="radio" name="control-view" value="assets" checked onchange="viewSwap()"> Everything else</label>
<label><input type="radio" name="control-view" value="plugs" onchange="viewSwap()"> Kasa plugs</label></div>
<div class="row"><button id="reset-all" onclick="resetAll()" style="display:none">Reset everything to studio default</button><label class="field" id="reset-plugs-row" style="display:none"><input type="checkbox" id="reset-plugs"> also reset Kasa plugs</label></div>
<div id="assets-view">
<div id="card"></div>
</div>
<div class="card" id="plugs-view" style="display:none"><h2>Kasa plugs</h2><div id="plugs">loading…</div></div>
<div id="out"></div>
</div>
<script>
async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
  return data;
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function out(data, ok, summary) {
  const line = summary === undefined
    ? (data && typeof data === "object" ? (data.status || data.error || (ok === false ? "Failed" : "Done")) : String(data))
    : summary;
  document.getElementById("out").innerHTML =
    '<div class="result ' + (ok === false ? "bad" : "ok") + '"><div class="result-line"><span class="dot">●</span><span>' +
    esc(line) + '</span></div><details class="result-json"><summary>Details</summary><pre>' +
    esc(JSON.stringify(data, null, 1)) + "</pre></details></div>";
}
function studio() { return document.getElementById("studio").value; }
function deviceId() { return document.getElementById("device").value; }
function current() { return DEVICES.find((d) => d.id === deviceId()); }

function dualProtocol(d) {
  const a = d.driverAddress || {};
  return Boolean(a.channel && a.group && a.dmx && a.dmx.dimmer);
}

function effFamily(d) {
  // Effective driver family after the transport pick (mirrors the backend).
  if ((d.driver === "ninja" || d.driver === "dmx") && (d.transport === "ble" || d.transport === "dmx"))
    return d.transport === "ble" ? "ninja" : "dmx";
  return d.driver;
}

async function transportSet(id, value) {
  try {
    const r = await fetch("/api/studios/" + studio() + "/devices/" + id + "/transport",
      {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({transport: value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.status);
    out(j, true, id + " now on " + (value === "ble" ? "BLE" : "DMX"));
    loadDevices();
  } catch (e) { out({error: String(e)}, false); }
}
let DEVICES = [];
let RANGES = {};   // effective per-device ranges from the shared resolver (no hardcoded spans)
let DEFAULT_SET = null;   // assigned default set for this studio ({label, devices, plugs}) or null
let DEFAULT_SET_ID = null;

function sessKey(id) { return "twoc.control." + studio() + "." + id; }
function sessRead(id) {
  try { return JSON.parse(sessionStorage.getItem(sessKey(id)) || "{}") || {}; }
  catch (e) { return {}; }
}
function sessWrite(id, values) {
  try {
    sessionStorage.setItem(sessKey(id), JSON.stringify(Object.assign(sessRead(id), values)));
  } catch (e) { /* storage blocked: session memory off, page still works */ }
}
function defaultValues(id) {
  if (!DEFAULT_SET || !DEFAULT_SET.devices) return {};
  return DEFAULT_SET.devices[id] || {};
}
function hasDefault(id) { return Object.keys(defaultValues(id)).length > 0; }
function initVal(id, key, fallback) {
  // Session (what this tab last sent) wins; then the studio default set
  // (file key "intensity" feeds the card's brightness input); else hardcoded.
  const s = sessRead(id);
  if (s[key] !== undefined) return s[key];
  const d = defaultValues(id);
  const fileKey = key === "brightness" ? "intensity" : key;
  if (d[fileKey] !== undefined) return d[fileKey];
  return fallback;
}

function drivable(d) {
  if (d.controllable === false) return false;
  if (d.type === "light" && (d.driver === "gvm" || d.driver === "dmx" || d.driver === "ninja" || d.driver === "mock")) return true;
  if (d.type === "lightstrip" && d.driver === "ir") return true;
  if (d.type === "screen" && d.driver === "screen") return true;
  return false;
}

async function loadStudios() {
  try {
    const studios = await jget("/api/studios");
    const ids = studios.map((s) => s.id || s);
    document.getElementById("studio").innerHTML = ids.map((id) =>
      "<option value='" + id + "'" + (id === "home-studio" ? " selected" : "") + ">" + id + "</option>").join("");
  } catch (e) {
    document.getElementById("studio").innerHTML = "<option value='home-studio'>home-studio</option>";
  }
  loadDevices();
}

function viewSwap() {
  const plugs = document.querySelector('input[name="control-view"]:checked').value === "plugs";
  document.getElementById("assets-view").style.display = plugs ? "none" : "";
  document.getElementById("plugs-view").style.display = plugs ? "" : "none";
}

async function loadPlugs() {
  try {
    const r = await jget("/api/kasa/plugs");
    document.getElementById("plugs").innerHTML = r.plugs.map((p) =>
      '<div class="namerow"><span class="name">' + esc(p.alias || p.plug) + "</span>" +
      '<span class="state" id="cp-state-' + p.plug + '">?</span>' +
      "<button onclick=\"plugSet('" + p.plug + "',true)\">On</button>" +
      "<button onclick=\"plugSet('" + p.plug + "',false)\">Off</button>" +
      "<button onclick=\"plugState('" + p.plug + "')\">State</button>" +
      "<button onclick=\"plugReset('" + p.plug + "')\">Reset</button>" +
      ' <span class="meta">' + esc(p.zone || "") + "</span></div>").join("") || "no plugs";
  } catch (e) { document.getElementById("plugs").textContent = "plugs unavailable"; }
}
async function plugState(plug) {
  try {
    const r = await jget("/api/kasa/plugs/" + plug + "/state");
    const el = document.getElementById("cp-state-" + plug);
    if (el) el.textContent = r.ok ? (r.state.power || "?") : "error";
    if (r.ok && (r.state.power === "on" || r.state.power === "off"))
      sessWrite("plug." + plug, {on: r.state.power === "on"});
    out(r, r.ok, plug + (r.ok ? " is " + (r.state.power || "?") : " failed"));
  } catch (e) { out({error: String(e)}, false); }
}
async function sendPlug(plug, on) {
  return jpost("/api/kasa/plugs/" + plug + "/set", JSON.stringify({on: on}));
}
async function plugSet(plug, on) {
  try {
    const r = await sendPlug(plug, on);
    const el = document.getElementById("cp-state-" + plug);
    if (el && r.ok) el.textContent = r.state.power || (on ? "on" : "off");
    if (r.ok) sessWrite("plug." + plug, {on: on});
    out(r, r.ok, plug + (r.ok ? " → " + (r.state.power || "?") : " failed"));
  } catch (e) { out({error: String(e)}, false); }
}
async function plugReset(plug) {
  const want = (DEFAULT_SET && DEFAULT_SET.plugs && DEFAULT_SET.plugs[plug]) || null;
  if (!want) { out({error: "no saved default for " + plug}, false); return; }
  try {
    const r = await sendPlug(plug, want.on);
    const el = document.getElementById("cp-state-" + plug);
    if (el && r.ok) el.textContent = r.state.power || (want.on ? "on" : "off");
    if (r.ok) sessWrite("plug." + plug, {on: want.on});
    out(r, r.ok, plug + (r.ok ? " reset → " + (r.state.power || "?") : " failed"));
  } catch (e) { out({error: String(e)}, false); }
}

async function loadDevices() {
  try {
    DEVICES = await jget("/api/studios/" + studio() + "/devices");
  } catch (e) { out({error: String(e)}, false); return; }
  try {
    RANGES = (await jget("/api/studios/" + studio() + "/ranges")).devices || {};
  } catch (e) { RANGES = {}; }
  const shown = DEVICES.filter((d) => drivable(d));
  document.getElementById("device").innerHTML = shown.map((d) =>
    "<option value='" + d.id + "'>" + esc(d.name || d.id) + "</option>").join("");
  try {
    const ds = await jget("/api/studios/" + studio() + "/defaults");
    DEFAULT_SET_ID = ds.default || null;
    DEFAULT_SET = (ds.default && ds.sets && ds.sets[ds.default]) || null;
  } catch (e) { DEFAULT_SET_ID = null; DEFAULT_SET = null; }
  document.getElementById("reset-all").style.display = DEFAULT_SET ? "" : "none";
  document.getElementById("reset-plugs-row").style.display =
    (DEFAULT_SET && Object.keys(DEFAULT_SET.plugs || {}).length) ? "" : "none";
  renderCard();
}

function sliderRow(id, label, min, max, step, val, unit, liveFn) {
  const live = liveFn ? ";" + liveFn : "";
  return '<div class="row"><label class="field" for="' + id + '">' + label + '</label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" ' +
    'oninput="document.getElementById(\'' + id + '-n\').value = this.value' + live + '">' +
    '<label class="field"><input type="number" id="' + id + '-n" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" style="width:5em" ' +
    'onchange="document.getElementById(\'' + id + '\').value = this.value' + live + '"> ' + (unit || "") + "</label></div>";
}

function cctBounds(d) {
  // One resolver for every page: the ranges endpoint (profile spec wins,
  // generic outer bounds only where a profile omits the range).
  const info = ((RANGES[d.id] || {}).values || {}).cct;
  if (info && info.supported !== false && info.min !== undefined) return [info.min, info.max, info.step || 100];
  const spec = (d.spec || {}).cctRange;
  if (spec && spec.length === 2) return [spec[0], spec[1], 100];
  return [2500, 8500, 100];
}

function renderCard() {
  const d = current();
  const el = document.getElementById("card");
  if (!d) { el.innerHTML = ""; return; }
  if (!drivable(d)) {
    el.innerHTML = '<div class="card"><h2>' + esc(d.name || d.id) + '</h2><p class="hint">' +
      [d.type, d.zone, d.role].filter(Boolean).map(esc).join(" · ") + '</p><p class="hint">Hand-operated — no remote control. Details live on the Equipment page.</p></div>';
    return;
  }
  const caps = d.capabilities || {};
  let h = '<div class="card"><h2>' + esc(d.name || d.id) + '</h2><p class="hint">' +
    [d.type, d.zone, d.role, d.driver].filter(Boolean).map(esc).join(" · ") + "</p>";
  if (dualProtocol(d)) {
    const cur = d.transport || "ble";
    h += '<div class="row"><label class="field">Control via <select onchange="transportSet(\'' + d.id + '\', this.value)">' +
      '<option value="ble"' + (cur === "ble" ? " selected" : "") + '>BLE</option>' +
      '<option value="dmx"' + (cur === "dmx" ? " selected" : "") + '>DMX</option></select></label>' +
      '<span class="hint">dual-protocol fixture: bench, modes, AI and Control all follow this</span></div>';
  }
  if (hasDefault(d.id))
    h += '<div class="row"><button onclick="resetDevice()">Reset to default</button>' +
      '<span class="hint">studio default: ' + esc(DEFAULT_SET.label || DEFAULT_SET_ID || "") + "</span></div>";
  else
    h += '<div class="row"><span class="hint">No saved default for this asset — manage default sets on the Equipment page.</span></div>';
  if (d.type === "screen") {
    h += '<div class="row"><label class="field" for="c-theme">Theme</label><select id="c-theme"><option value="">Default</option><option value="live">Live</option><option value="work">Work</option><option value="focus">Focus</option><option value="warm">Warm</option><option value="candle">Candle</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="slate">Slate</option><option value="rose">Rose</option></select></div>' +
      '<div class="row"><label class="field" for="c-anim">Animation</label><select id="c-anim"><option value="">None</option><option value="fireplace">Fireplace</option><option value="fishtank">Fish tank</option><option value="underwater">Underwater reef</option><option value="starfield">Starfield</option><option value="nebula">Nebula (JWST infrared)</option><option value="galaxy">Galaxy (Hubble spiral)</option><option value="code">Code rain (programming)</option><option value="arcade">Arcade (gaming)</option><option value="gears">Gears (crafting / Gunpla)</option><option value="dice">Dice (D&amp;D)</option><option value="puzzle">Puzzle</option><option value="bistro">Bistro (food / drink)</option><option value="tailor">Tailor (cosplay / sewing)</option><option value="unbox">Unboxing</option><option value="aperture">Aperture (camera)</option><option value="circuit">Circuit (tech news)</option><option value="photons">Photons (Scotty Photon)</option></select></div>' +
      '<div class="row"><label class="field" for="c-text">Text</label><input type="text" id="c-text" placeholder="Tonight: co-op night"></div>' +
      '<div class="row"><label class="field" for="c-ttl">Show s</label><input type="number" id="c-ttl" value="0" min="0" max="3600"></div>' +
      '<div class="row"><button onclick="screenPush()">Push to screen</button><button onclick="screenClear()">Clear</button></div>' +
      '<hr><div class="row"><span class="hint">Audio</span></div><div class="row"><label class="field" for="c-track">Track</label><select id="c-track"><option value="piano">Piano</option><option value="eurobeat">Eurobeat</option><option value="dance">Dance</option><option value="synthwave">Synthwave</option><option value="ocean">Ocean</option><option value="space">Space</option><option value="lofi">Lo-fi (co-working)</option><option value="chiptune">Chiptune (gaming)</option></select></div>' +
      sliderRow("c-vol", "Audio volume", 0, 100, 1, initVal(d.id, "volume", 100), "%", "screenVolume()") +
      '<div class="row"><button onclick="screenAudio(\'play\')">Play bed</button><button onclick="screenAudio(\'stop\')">Stop bed</button></div>' +
      '<div class="row"><label class="field" for="c-fx">Audio FX</label><select id="c-fx"><option value="stinger">stinger</option><option value="ding">ding</option><option value="pop">pop</option><option value="coin">coin</option><option value="levelup">levelup</option><option value="powerup">powerup</option><option value="whoosh">whoosh</option><option value="error">error</option><option value="success">success</option><option value="applause">applause</option><option value="laser">laser</option><option value="unlock">unlock</option><option value="alert">alert</option><option value="blip">blip</option></select><button onclick="screenFx()">Play FX</button></div>';
  } else if (d.driver === "ir") {
    h += '<div class="row"><button onclick="irSend(\'on\')">On</button><button onclick="irSend(\'off\')">Off</button></div>' +
      '<div class="row"><label class="field">Fixed color</label></div><div class="swatches" id="c-swatches"><span class="hint">loading…</span></div>' +
      '<p class="hint">No brightness levels on the strip — brightness stepping stays on the Test Bench.</p>';
  } else {
    if (effFamily(d) === "gvm" || effFamily(d) === "ninja" || effFamily(d) === "mock")
      h += '<div class="row"><button onclick="lightPower(\'on\')">On</button><button onclick="lightPower(\'off\')">Off</button></div>';
    else
      h += '<p class="hint">DMX has no power switch — 0% is dark.</p>';
    h += sliderRow("c-br", "Brightness", 0, 100, 1, initVal(d.id, "brightness", 5), "%") +
      '<div class="row"><button onclick="lightBright()">Set brightness</button></div>';
    if (caps.cct !== false) {
      const [cctMin, cctMax, cctStep] = cctBounds(d);
      h += sliderRow("c-cct", "Color temperature", cctMin, cctMax, cctStep, initVal(d.id, "cct", 5600), "K") +
        '<div class="row"><button onclick="lightCct()">Set CCT</button><span class="hint">' + cctMin + "–" + cctMax + " K · this fixture's span</span></div>";
    }
    if (caps.rgb) {
      h += sliderRow("c-hue", "Hue", 0, 360, 5, initVal(d.id, "hue", 220), "°") +
        sliderRow("c-sat", "Saturation", 0, 100, 1, initVal(d.id, "saturation", 60), "%") +
        '<div class="row"><button onclick="lightHsi()">Set color</button></div>';
    }
    if (d.driver === "dmx" || d.driver === "ninja")
      h += '<div class="row"><label class="field"><input type="checkbox" id="c-bright"> allow bright (past the gentle 10%)</label></div>';
  }
  el.innerHTML = h + "</div>";
  if (d.type === "screen") {
    document.getElementById("c-theme").value = initVal(d.id, "theme", "");
    document.getElementById("c-anim").value = initVal(d.id, "animation", "");
    document.getElementById("c-text").value = initVal(d.id, "text", "");
    document.getElementById("c-track").value = initVal(d.id, "track", "piano");
  }
  if (d.driver === "ir") loadSwatches();
}

function allowBright() { const c = document.getElementById("c-bright"); return c ? c.checked : false; }

async function sendPower(d, on) {
  const where = studio() + "/" + d.id, fam = effFamily(d);
  if (fam === "gvm")
    return jpost("/api/testbench/gvm/set", JSON.stringify({panel: where, power: on}));
  if (fam === "ninja")
    return jpost("/api/testbench/ninja/set", JSON.stringify({light: where, power: on}));
  throw new Error(fam + " has no power switch here");
}

async function sendTransport(d, value) {
  const r = await fetch("/api/studios/" + studio() + "/devices/" + d.id + "/transport",
    {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({transport: value})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.status);
  d.transport = value;
  return j;
}

async function sendBright(d, v, brightOk) {
  const where = studio() + "/" + d.id, fam = effFamily(d);
  if (fam === "gvm")
    return jpost("/api/testbench/gvm/set", JSON.stringify({panel: where, brightness: v}));
  if (fam === "ninja")
    return jpost("/api/testbench/ninja/set", JSON.stringify({light: where, brightness: v, allow_bright: brightOk}));
  if (fam === "dmx")
    return jpost("/api/testbench/dmx/light", JSON.stringify({studio: studio(), fixture: d.id, power: v, allow_bright: brightOk}));
  throw new Error(fam + " brightness is bench-only");
}

async function sendCct(d, v) {
  const where = studio() + "/" + d.id, fam = effFamily(d);
  if (fam === "gvm")
    return jpost("/api/testbench/gvm/set", JSON.stringify({panel: where, page: "cct", cct: v}));
  if (fam === "ninja")
    return jpost("/api/testbench/ninja/set", JSON.stringify({light: where, cct: v}));
  if (fam === "dmx")
    return jpost("/api/testbench/dmx/light", JSON.stringify({studio: studio(), fixture: d.id, cct: v}));
  throw new Error(fam + " CCT is bench-only");
}

async function sendHsi(d, hue, sat) {
  if (effFamily(d) === "gvm")
    return jpost("/api/testbench/gvm/set", JSON.stringify({panel: studio() + "/" + d.id, page: "hsi", hue: hue, saturation: sat}));
  throw new Error(effFamily(d) + " has no color picker here");
}

async function lightPower(on) {
  const d = current();
  try {
    out(await sendPower(d, on), true, "Power " + on);
    sessWrite(d.id, {power: on});
  } catch (e) { out({error: String(e)}, false); }
}

async function lightBright() {
  const d = current(), v = parseInt(document.getElementById("c-br-n").value, 10);
  try {
    out(await sendBright(d, v, allowBright()), true, "Brightness → " + v + "%");
    sessWrite(d.id, {brightness: v});
  } catch (e) { out({error: String(e)}, false); }
}

async function lightCct() {
  const d = current(), v = parseInt(document.getElementById("c-cct-n").value, 10);
  try {
    out(await sendCct(d, v), true, "CCT → " + v + "K");
    sessWrite(d.id, {cct: v});
  } catch (e) { out({error: String(e)}, false); }
}

async function lightHsi() {
  const d = current();
  const hue = parseInt(document.getElementById("c-hue-n").value, 10);
  const sat = parseInt(document.getElementById("c-sat-n").value, 10);
  try {
    out(await sendHsi(d, hue, sat), true, "Color → " + hue + "° / " + sat + "%");
    sessWrite(d.id, {hue: hue, saturation: sat});
  } catch (e) { out({error: String(e)}, false); }
}

async function resetOne(d) {
  // Drive one device to its default-set values. Returns step summaries.
  const want = defaultValues(d.id);
  const steps = [];
  if (d.type === "screen") {
    const body = {screen: d.id, theme: want.theme || "", text: want.text || "",
      animation: want.animation || ""};
    await sendScreenPush(body);
    sessWrite(d.id, {theme: body.theme, text: body.text, animation: body.animation});
    return ["pushed " + (body.theme || "default theme")];
  }
  if (d.driver === "ir") {
    if (want.power !== undefined) { await sendIr(want.power, d.id); steps.push("power " + want.power); }
    if (want.color !== undefined) { await sendIr(want.color, d.id); steps.push("color " + want.color); }
    if (!steps.length) throw new Error("nothing resettable for " + d.id);
    sessWrite(d.id, Object.assign({},
      want.power !== undefined ? {power: want.power} : null,
      want.color !== undefined ? {color: want.color} : null));
    return steps;
  }
  // Saved interface first: the look below routes through the picked family.
  let flipped = false;
  if (want.transport !== undefined && dualProtocol(d) && d.transport !== want.transport) {
    await sendTransport(d, want.transport); steps.push("interface " + want.transport); flipped = true;
  }
  if (flipped) sessWrite(d.id, {transport: want.transport});
  // Reset restores saved levels exactly, so it always allows bright: the
  // checkbox guards ad-hoc slider moves, not a deliberate restore.
  if (want.power !== undefined && (effFamily(d) === "gvm" || effFamily(d) === "ninja")) {
    await sendPower(d, want.power); steps.push("power " + want.power);
  }
  if (want.intensity !== undefined) {
    await sendBright(d, want.intensity, true); steps.push("brightness " + want.intensity + "%");
  }
  if (want.cct !== undefined) { await sendCct(d, want.cct); steps.push("CCT " + want.cct + "K"); }
  if (want.hue !== undefined || want.saturation !== undefined) {
    const hue = want.hue !== undefined ? want.hue : initVal(d.id, "hue", 220);
    const sat = want.saturation !== undefined ? want.saturation : initVal(d.id, "saturation", 60);
    await sendHsi(d, hue, sat); steps.push("color " + hue + "°/" + sat + "%");
  }
  if (!steps.length) throw new Error("nothing resettable for " + d.id);
  const mem = {};
  if (want.power !== undefined) mem.power = want.power;
  if (want.intensity !== undefined) mem.brightness = want.intensity;
  if (want.cct !== undefined) mem.cct = want.cct;
  if (want.hue !== undefined) mem.hue = want.hue;
  if (want.saturation !== undefined) mem.saturation = want.saturation;
  sessWrite(d.id, mem);
  return steps;
}

async function refreshKeepSelection() {
  const id = deviceId();
  await loadDevices();
  const sel = document.getElementById("device");
  if ([...sel.options].some((o) => o.value === id)) sel.value = id;
  renderCard();
}

async function resetDevice() {
  const d = current();
  if (!hasDefault(d.id)) { out({error: "no saved default for " + d.id}, false); return; }
  try {
    const steps = await resetOne(d);
    out({reset: d.id}, true, d.id + " reset: " + steps.join(", "));
    if (steps.some((s) => s.indexOf("interface ") === 0)) await refreshKeepSelection();
    else renderCard();
  } catch (e) { out({error: String(e)}, false); }
}

async function resetAll() {
  if (!DEFAULT_SET) return;
  const done = [], failed = [], skipped = [];
  let flipped = false;
  for (const id of Object.keys(DEFAULT_SET.devices || {})) {
    const d = DEVICES.find((x) => x.id === id);
    if (!d || !drivable(d)) { skipped.push(id); continue; }
    try {
      const steps = await resetOne(d);
      if (steps.some((s) => s.indexOf("interface ") === 0)) flipped = true;
      done.push(id);
    }
    catch (e) { failed.push(id); }
  }
  const plugOk = document.getElementById("reset-plugs").checked;
  const plugHeld = [];
  for (const plug of Object.keys(DEFAULT_SET.plugs || {})) {
    if (!plugOk) { plugHeld.push(plug); continue; }
    try {
      const r = await sendPlug(plug, DEFAULT_SET.plugs[plug].on);
      if (r.ok) { sessWrite("plug." + plug, {on: DEFAULT_SET.plugs[plug].on}); done.push(plug); }
      else failed.push(plug);
    } catch (e) { failed.push(plug); }
  }
  let summary = done.length + " reset";
  if (failed.length) summary += "; failed: " + failed.join(", ");
  if (skipped.length) summary += "; skipped (manual): " + skipped.join(", ");
  if (plugHeld.length) summary += "; plugs held (tick the plug box): " + plugHeld.join(", ");
  out({done: done, failed: failed, skipped: skipped}, failed.length === 0, summary);
  if (flipped) await refreshKeepSelection();
  else renderCard();
  loadPlugs();
}

async function loadSwatches() {
  try {
    const codes = await jget("/api/testbench/ir/codes?studio=" + studio() + "&device=" + deviceId());
    const fixed = Object.keys(codes).filter((label) =>
      label !== "on" && label !== "off" && label !== "brightness-up" && label !== "brightness-down" &&
      !(codes[label] && codes[label].photoRisk)).sort();
    document.getElementById("c-swatches").innerHTML = fixed.map((label) =>
      "<button onclick=\"irSend('" + label.replace(/'/g, "\\'") + "')\">" + esc(label) + "</button>").join("");
  } catch (e) { document.getElementById("c-swatches").innerHTML = '<span class="hint">no saved codes</span>'; }
}

async function sendIr(label, id) {
  return jpost("/api/testbench/ir/send", JSON.stringify({studio: studio(), device: id || deviceId(), label: label}));
}

async function irSend(label) {
  try {
    out(await sendIr(label), true, "Sent " + label);
    sessWrite(deviceId(), (label === "on" || label === "off") ? {power: label} : {color: label});
  } catch (e) { out({error: String(e)}, false); }
}

async function sendScreenPush(body) {
  return jpost("/api/testbench/screen/push", JSON.stringify(body));
}

async function screenPush() {
  try {
    const ttl = parseInt(document.getElementById("c-ttl").value, 10);
    const body = {
      screen: deviceId(),
      theme: document.getElementById("c-theme").value,
      text: document.getElementById("c-text").value || null,
      animation: document.getElementById("c-anim").value};
    if (body.text && ttl > 0) body.text_ttl_s = ttl;
    const r = await sendScreenPush(body);
    sessWrite(deviceId(), {theme: body.theme || "", text: body.text || "", animation: body.animation || ""});
    out(r, true, "Pushed to " + (current().name || deviceId()));
  } catch (e) { out({error: String(e)}, false); }
}

async function screenClear() {
  try {
    const r = await sendScreenPush({screen: deviceId(), theme: "", text: "", animation: ""});
    sessWrite(deviceId(), {theme: "", text: "", animation: ""});
    out(r, true, "Cleared " + (current().name || deviceId()));
  } catch (e) { out({error: String(e)}, false); }
}

let screenPlaying = false, screenVolTimer = null;
async function screenAudio(action, quiet) {
  try {
    const body = {screen: deviceId(), action: action};
    if (action === "play") {
      body.track = document.getElementById("c-track").value;
      body.volume = parseInt(document.getElementById("c-vol-n").value, 10);
    }
    const r = await jpost("/api/testbench/screen/audio", JSON.stringify(body));
    screenPlaying = action === "play" && r.ok;
    if (action === "play" && r.ok) sessWrite(deviceId(), {track: body.track, volume: body.volume});
    if (!quiet || !r.ok) out(r, r.ok, "Bed " + action);
  } catch (e) { out({error: String(e)}, false); }
}

async function screenFx() {
  try { const r = await jpost("/api/testbench/screen/fx", JSON.stringify({screen: deviceId(), fx: document.getElementById("c-fx").value, volume: 40}));
    out(r, r.ok, "FX " + document.getElementById("c-fx").value); } catch (e) { out({error: String(e)}, false); }
}

function screenVolume() {
  if (!screenPlaying) return;
  clearTimeout(screenVolTimer);
  screenVolTimer = setTimeout(() => screenAudio("play", true), 150);
}

loadStudios();
loadPlugs();
fetch("/api/testbench/kasa/prime", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}).catch(() => {});
</script>
