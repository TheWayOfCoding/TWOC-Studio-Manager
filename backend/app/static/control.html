<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Hub — Control</title>
<link rel="stylesheet" href="/hub.css">
</head>
<body>
<header class="topbar">
<span class="brand">Studio Hub</span>
<nav><a href="/">Dashboard</a><a href="/control" aria-current="page">Control</a><a href="/equipment">Equipment</a><span class="navgroup">Administration</span><a href="/modality">Modality Manager</a><a href="/ordering">Ordering</a><a href="/bench">Test Bench</a><a href="/docs">API docs</a></nav>
</header>
<div class="wrap narrow">
<h1>Control</h1>
<p class="lede">Adjust one asset at a time. Pick it below — scenes and raw bring-up stay on the Test Bench.</p>
<div class="row"><label class="field" for="studio">Studio</label><select id="studio" onchange="loadDevices()"></select></div>
<div class="row"><label class="field" for="device">Asset (A–Z)</label><select id="device" onchange="renderCard()"></select></div>
<div class="row"><label><input type="radio" name="control-view" value="assets" checked onchange="viewSwap()"> Everything else</label>
<label><input type="radio" name="control-view" value="plugs" onchange="viewSwap()"> Kasa plugs</label></div>
<div id="assets-view">
<div id="card"></div>
</div>
<div class="card" id="plugs-view" style="display:none"><h2>Kasa plugs</h2><div id="plugs">loading…</div></div>
<div id="out"></div>
</div>
<script>
async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function jpost(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || JSON.stringify(data));
  return data;
}
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function out(data, ok, summary) {
  const line = summary === undefined
    ? (data && typeof data === "object" ? (data.status || data.error || (ok === false ? "Failed" : "Done")) : String(data))
    : summary;
  document.getElementById("out").innerHTML =
    '<div class="result ' + (ok === false ? "bad" : "ok") + '"><div class="result-line"><span class="dot">●</span><span>' +
    esc(line) + '</span></div><details class="result-json"><summary>Details</summary><pre>' +
    esc(JSON.stringify(data, null, 1)) + "</pre></details></div>";
}
function studio() { return document.getElementById("studio").value; }
function deviceId() { return document.getElementById("device").value; }
function current() { return DEVICES.find((d) => d.id === deviceId()); }

function dualProtocol(d) {
  const a = d.driverAddress || {};
  return Boolean(a.channel && a.group && a.dmx && a.dmx.dimmer);
}

async function transportSet(id, value) {
  try {
    const r = await fetch("/api/studios/" + studio() + "/devices/" + id + "/transport",
      {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({transport: value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || r.status);
    out(j, true, id + " now on " + (value === "ble" ? "BLE" : "DMX"));
    loadDevices();
  } catch (e) { out({error: String(e)}, false); }
}
let DEVICES = [];

function drivable(d) {
  if (d.controllable === false) return false;
  if (d.type === "light" && (d.driver === "gvm" || d.driver === "dmx" || d.driver === "ninja" || d.driver === "mock")) return true;
  if (d.type === "lightstrip" && d.driver === "ir") return true;
  if (d.type === "screen" && d.driver === "screen") return true;
  return false;
}

async function loadStudios() {
  try {
    const studios = await jget("/api/studios");
    const ids = studios.map((s) => s.id || s);
    document.getElementById("studio").innerHTML = ids.map((id) =>
      "<option value='" + id + "'" + (id === "home-studio" ? " selected" : "") + ">" + id + "</option>").join("");
  } catch (e) {
    document.getElementById("studio").innerHTML = "<option value='home-studio'>home-studio</option>";
  }
  loadDevices();
}

function viewSwap() {
  const plugs = document.querySelector('input[name="control-view"]:checked').value === "plugs";
  document.getElementById("assets-view").style.display = plugs ? "none" : "";
  document.getElementById("plugs-view").style.display = plugs ? "" : "none";
}

async function loadPlugs() {
  try {
    const r = await jget("/api/kasa/plugs");
    document.getElementById("plugs").innerHTML = r.plugs.map((p) =>
      '<div class="namerow"><span class="name">' + esc(p.alias || p.plug) + "</span>" +
      '<span class="state" id="cp-state-' + p.plug + '">?</span>' +
      "<button onclick=\"plugSet('" + p.plug + "',true)\">On</button>" +
      "<button onclick=\"plugSet('" + p.plug + "',false)\">Off</button>" +
      "<button onclick=\"plugState('" + p.plug + "')\">State</button>" +
      ' <span class="meta">' + esc(p.zone || "") + "</span></div>").join("") || "no plugs";
  } catch (e) { document.getElementById("plugs").textContent = "plugs unavailable"; }
}
async function plugState(plug) {
  try {
    const r = await jget("/api/kasa/plugs/" + plug + "/state");
    const el = document.getElementById("cp-state-" + plug);
    if (el) el.textContent = r.ok ? (r.state.power || "?") : "error";
    out(r, r.ok, plug + (r.ok ? " is " + (r.state.power || "?") : " failed"));
  } catch (e) { out({error: String(e)}, false); }
}
async function plugSet(plug, on) {
  try {
    const r = await jpost("/api/kasa/plugs/" + plug + "/set", JSON.stringify({on: on}));
    const el = document.getElementById("cp-state-" + plug);
    if (el && r.ok) el.textContent = r.state.power || (on ? "on" : "off");
    out(r, r.ok, plug + (r.ok ? " → " + (r.state.power || "?") : " failed"));
  } catch (e) { out({error: String(e)}, false); }
}

async function loadDevices() {
  try {
    DEVICES = await jget("/api/studios/" + studio() + "/devices");
  } catch (e) { out({error: String(e)}, false); return; }
  const shown = DEVICES.filter((d) => d.type === "light" || d.type === "lightstrip" || d.type === "screen");
  document.getElementById("device").innerHTML = shown.map((d) =>
    "<option value='" + d.id + "'" + (drivable(d) ? "" : " disabled") + ">" +
    esc(d.name || d.id) + (drivable(d) ? "" : " (manual)") + "</option>").join("");
  renderCard();
}

function sliderRow(id, label, min, max, step, val, unit, liveFn) {
  const live = liveFn ? ";" + liveFn : "";
  return '<div class="row"><label class="field" for="' + id + '">' + label + '</label>' +
    '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" ' +
    'oninput="document.getElementById(\'' + id + '-n\').value = this.value' + live + '">' +
    '<label class="field"><input type="number" id="' + id + '-n" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '" style="width:5em" ' +
    'onchange="document.getElementById(\'' + id + '\').value = this.value' + live + '"> ' + (unit || "") + "</label></div>";
}

function renderCard() {
  const d = current();
  const el = document.getElementById("card");
  if (!d) { el.innerHTML = ""; return; }
  if (!drivable(d)) {
    el.innerHTML = '<div class="card"><h2>' + esc(d.name || d.id) + '</h2><p class="hint">' +
      [d.type, d.zone, d.role].filter(Boolean).map(esc).join(" · ") + '</p><p class="hint">Hand-operated — no remote control. Details live on the Equipment page.</p></div>';
    return;
  }
  const caps = d.capabilities || {};
  let h = '<div class="card"><h2>' + esc(d.name || d.id) + '</h2><p class="hint">' +
    [d.type, d.zone, d.role, d.driver].filter(Boolean).map(esc).join(" · ") + "</p>";
  if (dualProtocol(d)) {
    const cur = d.transport || "ble";
    h += '<div class="row"><label class="field">Control via <select onchange="transportSet(\'' + d.id + '\', this.value)">' +
      '<option value="ble"' + (cur === "ble" ? " selected" : "") + '>BLE</option>' +
      '<option value="dmx"' + (cur === "dmx" ? " selected" : "") + '>DMX</option></select></label>' +
      '<span class="hint">dual-protocol fixture: bench, modes, AI and Control all follow this</span></div>';
  }
  if (d.type === "screen") {
    h += '<div class="row"><label class="field" for="c-theme">Theme</label><select id="c-theme"><option value="">Default</option><option value="live">Live</option><option value="work">Work</option><option value="focus">Focus</option><option value="warm">Warm</option><option value="candle">Candle</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="slate">Slate</option><option value="rose">Rose</option></select></div>' +
      '<div class="row"><label class="field" for="c-anim">Animation</label><select id="c-anim"><option value="">None</option><option value="fireplace">Fireplace</option><option value="fishtank">Fish tank</option><option value="underwater">Underwater reef</option><option value="starfield">Starfield</option><option value="nebula">Nebula (JWST infrared)</option><option value="galaxy">Galaxy (Hubble spiral)</option><option value="code">Code rain (programming)</option><option value="arcade">Arcade (gaming)</option><option value="gears">Gears (crafting / Gunpla)</option><option value="dice">Dice (D&amp;D)</option><option value="puzzle">Puzzle</option><option value="bistro">Bistro (food / drink)</option><option value="tailor">Tailor (cosplay / sewing)</option><option value="unbox">Unboxing</option><option value="aperture">Aperture (camera)</option><option value="circuit">Circuit (tech news)</option><option value="photons">Photons (Scotty Photon)</option></select></div>' +
      '<div class="row"><label class="field" for="c-text">Text</label><input type="text" id="c-text" placeholder="Tonight: co-op night"></div>' +
      '<div class="row"><label class="field" for="c-ttl">Show s</label><input type="number" id="c-ttl" value="0" min="0" max="3600"></div>' +
      '<div class="row"><button onclick="screenPush()">Push to screen</button><button onclick="screenClear()">Clear</button></div>' +
      '<hr><div class="row"><span class="hint">Audio</span></div><div class="row"><label class="field" for="c-track">Track</label><select id="c-track"><option value="piano">Piano</option><option value="eurobeat">Eurobeat</option><option value="dance">Dance</option><option value="synthwave">Synthwave</option><option value="ocean">Ocean</option><option value="space">Space</option><option value="lofi">Lo-fi (co-working)</option><option value="chiptune">Chiptune (gaming)</option></select></div>' +
      sliderRow("c-vol", "Audio volume", 0, 100, 1, 100, "%", "screenVolume()") +
      '<div class="row"><button onclick="screenAudio(\'play\')">Play bed</button><button onclick="screenAudio(\'stop\')">Stop bed</button></div>' +
      '<div class="row"><label class="field" for="c-fx">Audio FX</label><select id="c-fx"><option value="stinger">stinger</option><option value="ding">ding</option><option value="pop">pop</option><option value="coin">coin</option><option value="levelup">levelup</option><option value="powerup">powerup</option><option value="whoosh">whoosh</option><option value="error">error</option><option value="success">success</option><option value="applause">applause</option><option value="laser">laser</option><option value="unlock">unlock</option><option value="alert">alert</option><option value="blip">blip</option></select><button onclick="screenFx()">Play FX</button></div>';
  } else if (d.driver === "ir") {
    h += '<div class="row"><button onclick="irSend(\'on\')">On</button><button onclick="irSend(\'off\')">Off</button></div>' +
      '<div class="row"><label class="field">Fixed color</label></div><div class="swatches" id="c-swatches"><span class="hint">loading…</span></div>' +
      '<p class="hint">No brightness levels on the strip — brightness stepping stays on the Test Bench.</p>';
  } else {
    if (d.driver === "gvm" || d.driver === "ninja" || d.driver === "mock")
      h += '<div class="row"><button onclick="lightPower(\'on\')">On</button><button onclick="lightPower(\'off\')">Off</button></div>';
    else
      h += '<p class="hint">DMX has no power switch — 0% is dark.</p>';
    h += sliderRow("c-br", "Brightness", 0, 100, 1, 5, "%") +
      '<div class="row"><button onclick="lightBright()">Set brightness</button></div>';
    if (caps.cct !== false)
      h += sliderRow("c-cct", "Color temperature", 2500, 8500, 100, 5600, "K") +
        '<div class="row"><button onclick="lightCct()">Set CCT</button></div>';
    if (caps.rgb) {
      h += sliderRow("c-hue", "Hue", 0, 360, 5, 220, "°") +
        sliderRow("c-sat", "Saturation", 0, 100, 1, 60, "%") +
        '<div class="row"><button onclick="lightHsi()">Set color</button></div>';
    }
    if (d.driver === "dmx" || d.driver === "ninja")
      h += '<div class="row"><label class="field"><input type="checkbox" id="c-bright"> allow bright (past the gentle 10%)</label></div>';
  }
  el.innerHTML = h + "</div>";
  if (d.driver === "ir") loadSwatches();
}

function allowBright() { const c = document.getElementById("c-bright"); return c ? c.checked : false; }

async function lightPower(on) {
  const d = current();
  try {
    if (d.driver === "gvm")
      out(await jpost("/api/testbench/gvm/set", JSON.stringify({panel: studio() + "/" + d.id, power: on})), true, "Power " + on);
    else if (d.driver === "ninja")
      out(await jpost("/api/testbench/ninja/set", JSON.stringify({light: studio() + "/" + d.id, power: on})), true, "Power " + on);
    else
      out({error: d.driver + " has no power switch here"}, false);
  } catch (e) { out({error: String(e)}, false); }
}

async function lightBright() {
  const d = current(), v = parseInt(document.getElementById("c-br-n").value, 10);
  try {
    if (d.driver === "gvm")
      out(await jpost("/api/testbench/gvm/set", JSON.stringify({panel: studio() + "/" + d.id, page: "cct", brightness: v})), true, "Brightness → " + v + "%");
    else if (d.driver === "ninja")
      out(await jpost("/api/testbench/ninja/set", JSON.stringify({light: studio() + "/" + d.id, brightness: v, allow_bright: allowBright()})), true, "Brightness → " + v + "%");
    else if (d.driver === "dmx")
      out(await jpost("/api/testbench/dmx/light", JSON.stringify({studio: studio(), fixture: d.id, power: v, allow_bright: allowBright()})), true, "Brightness → " + v + "%");
    else
      out({error: d.driver + " brightness is bench-only"}, false);
  } catch (e) { out({error: String(e)}, false); }
}

async function lightCct() {
  const d = current(), v = parseInt(document.getElementById("c-cct-n").value, 10);
  try {
    if (d.driver === "gvm")
      out(await jpost("/api/testbench/gvm/set", JSON.stringify({panel: studio() + "/" + d.id, page: "cct", cct: v})), true, "CCT → " + v + "K");
    else if (d.driver === "ninja")
      out(await jpost("/api/testbench/ninja/set", JSON.stringify({light: studio() + "/" + d.id, cct: v})), true, "CCT → " + v + "K");
    else if (d.driver === "dmx")
      out(await jpost("/api/testbench/dmx/light", JSON.stringify({studio: studio(), fixture: d.id, cct: v})), true, "CCT → " + v + "K");
    else
      out({error: d.driver + " CCT is bench-only"}, false);
  } catch (e) { out({error: String(e)}, false); }
}

async function lightHsi() {
  const d = current();
  const hue = parseInt(document.getElementById("c-hue-n").value, 10);
  const sat = parseInt(document.getElementById("c-sat-n").value, 10);
  try {
    if (d.driver === "gvm")
      out(await jpost("/api/testbench/gvm/set", JSON.stringify({panel: studio() + "/" + d.id, page: "hsi", hue: hue, saturation: sat})), true, "Color → " + hue + "° / " + sat + "%");
    else
      out({error: d.driver + " has no color picker here"}, false);
  } catch (e) { out({error: String(e)}, false); }
}

async function loadSwatches() {
  try {
    const codes = await jget("/api/testbench/ir/codes?studio=" + studio() + "&device=" + deviceId());
    const fixed = Object.keys(codes).filter((label) =>
      label !== "on" && label !== "off" && label !== "brightness-up" && label !== "brightness-down" &&
      !(codes[label] && codes[label].photoRisk)).sort();
    document.getElementById("c-swatches").innerHTML = fixed.map((label) =>
      "<button onclick=\"irSend('" + label.replace(/'/g, "\\'") + "')\">" + esc(label) + "</button>").join("");
  } catch (e) { document.getElementById("c-swatches").innerHTML = '<span class="hint">no saved codes</span>'; }
}

async function irSend(label) {
  try {
    out(await jpost("/api/testbench/ir/send", JSON.stringify({studio: studio(), device: deviceId(), label: label})), true, "Sent " + label);
  } catch (e) { out({error: String(e)}, false); }
}

async function screenPush() {
  try {
    const ttl = parseInt(document.getElementById("c-ttl").value, 10);
    const body = {
      screen: deviceId(),
      theme: document.getElementById("c-theme").value,
      text: document.getElementById("c-text").value || null,
      animation: document.getElementById("c-anim").value};
    if (body.text && ttl > 0) body.text_ttl_s = ttl;
    out(await jpost("/api/testbench/screen/push", JSON.stringify(body)), true, "Pushed to " + (current().name || deviceId()));
  } catch (e) { out({error: String(e)}, false); }
}

async function screenClear() {
  try {
    out(await jpost("/api/testbench/screen/push", JSON.stringify({
      screen: deviceId(), theme: "", text: "", animation: ""})), true, "Cleared " + (current().name || deviceId()));
  } catch (e) { out({error: String(e)}, false); }
}

let screenPlaying = false, screenVolTimer = null;
async function screenAudio(action, quiet) {
  try {
    const body = {screen: deviceId(), action: action};
    if (action === "play") {
      body.track = document.getElementById("c-track").value;
      body.volume = parseInt(document.getElementById("c-vol-n").value, 10);
    }
    const r = await jpost("/api/testbench/screen/audio", JSON.stringify(body));
    screenPlaying = action === "play" && r.ok;
    if (!quiet || !r.ok) out(r, r.ok, "Bed " + action);
  } catch (e) { out({error: String(e)}, false); }
}

async function screenFx() {
  try { const r = await jpost("/api/testbench/screen/fx", JSON.stringify({screen: deviceId(), fx: document.getElementById("c-fx").value, volume: 40}));
    out(r, r.ok, "FX " + document.getElementById("c-fx").value); } catch (e) { out({error: String(e)}, false); }
}

function screenVolume() {
  if (!screenPlaying) return;
  clearTimeout(screenVolTimer);
  screenVolTimer = setTimeout(() => screenAudio("play", true), 150);
}

loadStudios();
loadPlugs();
fetch("/api/testbench/kasa/prime", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"}).catch(() => {});
</script>
</body>
</html>
